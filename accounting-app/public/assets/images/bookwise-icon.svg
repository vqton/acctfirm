<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <defs>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Book -->
  <g transform="translate(4, 8)">
    <!-- Left cover -->
    <path d="M4 6 C4 2 6 0 10 0 L10 36 C10 40 8 42 4 42 Z" fill="url(#bookGrad)" opacity="0.6"/>
    <!-- Right cover -->
    <path d="M52 6 C52 2 50 0 46 0 L46 36 C46 40 48 42 52 42 Z" fill="url(#bookGrad)" opacity="0.6"/>
    <!-- Left pages -->
    <rect x="10" y="0" width="18" height="36" rx="1" fill="url(#bookGrad)"/>
    <!-- Right pages -->
    <rect x="28" y="0" width="18" height="36" rx="1" fill="url(#bookGrad)"/>
    <!-- Spine -->
    <line x1="28" y1="2" x2="28" y2="34" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <!-- Page lines -->
    <line x1="14" y1="9" x2="24" y2="9" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <line x1="14" y1="14" x2="24" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <line x1="14" y1="19" x2="24" y2="19" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <line x1="32" y1="9" x2="42" y2="9" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <line x1="32" y1="14" x2="42" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <line x1="32" y1="19" x2="42" y2="19" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Star -->
  <g transform="translate(30, 2)">
    <path d="M0 -10 L2 -3 L9 -3 L3.5 1 L5.5 8 L0 4 L-5.5 8 L-3.5 1 L-9 -3 L-2 -3 Z" fill="url(#starGrad)"/>
  </g>
</svg>
